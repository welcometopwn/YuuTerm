[package]
name = "yuuterm-ssh"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
startup-probe = []

[dependencies]
anyhow = "1"
russh = { version = "=0.65.0", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
vt100 = "=0.16.2"
zeroize = "1"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util", "fs"] }
sha2 = "0.10"
rand = "0.10"
tokio-util = { version = "0.7", features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
yuuterm-core.workspace = true
serialport = { version = "=4.10.1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
des = { version = "0.9", features = ["zeroize"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-stream = "0.1"
