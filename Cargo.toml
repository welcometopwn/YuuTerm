[workspace]
members = ["crates/yuuterm-core", "crates/yuuterm-app", "crates/yuuterm-ssh", "crates/yuuterm-desktop"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yuuterm-core = { path = "crates/yuuterm-core" }

[profile.release]
lto = "thin"
strip = true
