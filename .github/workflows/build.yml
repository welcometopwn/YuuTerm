name: Windows preview
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and draft a release for, for example v0.2.1
        required: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "26"
      - name: Install Rust tools
        run: rustup component add rustfmt clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: npm ci
      # Tauri embeds the built UI (dist/) at compile time, so build it before clippy/tests.
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: npm run test:downloads
      - run: npm run test:archives
      - run: cargo clippy --workspace --all-targets --features yuuterm-desktop/capture -- -D warnings
      - run: cargo test --workspace
      - run: npm run test:ui
      - name: Cache verified X11 downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/x11-cache
            target/x11-sources
          key: ${{ runner.os }}-x11-${{ hashFiles('scripts/x11-runtime.json') }}
      - name: Build unsigned release
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YuuTerm-windows-x64-unsigned
          path: target/distribution/*
          if-no-files-found: error

  release:
    # Creates a draft only; a maintainer reviews and publishes it on GitHub.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Download build assets
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name YuuTerm-windows-x64-unsigned --dir dist
      - name: Check version and checksums
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "Invalid tag: $TAG"; exit 1; }
          version="${TAG#v}"
          for f in "YuuTerm-$version-x64-setup.exe" "YuuTerm-$version-portable.zip" "YuuTerm-$version-x11-sources.zip" SHA256SUMS.txt; do
            [[ -f "dist/$f" ]] || { echo "Missing dist/$f; the version in the sources must match $TAG"; exit 1; }
          done
          (cd dist && tr -d '\r' < SHA256SUMS.txt | sha256sum -c)
      - name: Extract release notes
        run: |
          version="${TAG#v}"
          awk -v h="## $version " 'index($0, h) == 1 {f = 1; next} /^## / {f = 0} f' CHANGELOG.md | sed '/./,$!d' > notes.md
          [[ -s notes.md ]] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Create draft release
        run: |
          prerelease=()
          [[ "$TAG" == v0.* || "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${prerelease[@]}" \
            --title "YuuTerm ${TAG#v}" --notes-file notes.md dist/*
