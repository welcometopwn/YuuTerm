name: Windows preview
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
      - name: Install Rust tools
        run: rustup component add rustfmt clippy
      - run: npm ci
      # Tauri embeds the built UI (dist/) at compile time, so build it before clippy/tests.
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features yuuterm-desktop/capture -- -D warnings
      - run: cargo test --workspace
      - run: npm run test:ui
      - name: Build unsigned release
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: YuuTerm-windows-x64-unsigned
          path: target/distribution/*
          if-no-files-found: error
